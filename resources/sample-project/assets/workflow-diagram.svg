<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#444"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">
    A conservative AI-assisted writing workflow
  </text>

  <!-- Writer column -->
  <rect x="40"  y="60" width="220" height="240" fill="#f5f7ff" stroke="#3050d0" stroke-width="1.5" rx="8"/>
  <text x="150" y="84" font-size="13" font-weight="bold" text-anchor="middle" fill="#3050d0">Writer owns</text>

  <text x="60"  y="115" font-size="12" fill="#222">• Reading sources</text>
  <text x="60"  y="138" font-size="12" fill="#222">• Argument structure</text>
  <text x="60"  y="161" font-size="12" fill="#222">• Original analysis</text>
  <text x="60"  y="184" font-size="12" fill="#222">• Voice / tone</text>
  <text x="60"  y="207" font-size="12" fill="#222">• Final review</text>
  <text x="60"  y="230" font-size="12" fill="#222">• Citation verification</text>
  <text x="60"  y="253" font-size="12" fill="#222">• Disclosure decisions</text>

  <!-- Loop arrows -->
  <line x1="265" y1="140" x2="455" y2="140" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="132" font-size="11" font-style="italic" text-anchor="middle" fill="#666">delegate</text>

  <line x1="455" y1="200" x2="265" y2="200" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="216" font-size="11" font-style="italic" text-anchor="middle" fill="#666">verify and integrate</text>

  <!-- Assistant column -->
  <rect x="460" y="60" width="220" height="240" fill="#fff5ec" stroke="#c06020" stroke-width="1.5" rx="8"/>
  <text x="570" y="84" font-size="13" font-weight="bold" text-anchor="middle" fill="#c06020">AI assists with</text>

  <text x="480" y="115" font-size="12" fill="#222">• Source-search shortlists</text>
  <text x="480" y="138" font-size="12" fill="#222">• BibTeX extraction</text>
  <text x="480" y="161" font-size="12" fill="#222">• Paraphrase + tighten</text>
  <text x="480" y="184" font-size="12" fill="#222">• Format conversion</text>
  <text x="480" y="207" font-size="12" fill="#222">• Outline critique</text>
  <text x="480" y="230" font-size="12" fill="#222">• Cross-ref + footnote ops</text>
  <text x="480" y="253" font-size="12" fill="#222">• Compile diagnostics</text>
</svg>
