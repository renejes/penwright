[package]
name = "penwright-ipad"
version = "0.15.6"
description = "Penwright on iPad — writing host. The Mac app stays Electron."
authors = ["René Jesser"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "penwright_ipad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Path copy of 1.5.1: the crates.io release dropped the iOS security scope
# before the native call returned, so later reads and writes failed.
tauri-plugin-scoped-storage = { path = "vendor/tauri-plugin-scoped-storage" }
